<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rune Zero — Game Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#f6f7fb; --panel:#ffffff; --panel-2:#eef1f7; --panel-3:#e4e8f1;
    --border:#e3e7f0; --border-2:#ccd3e1;
    --gold:#f4c430; --gold-deep:#9a7112; --gold-soft:#fbf1cf;
    --rune:#e2483f; --rune-deep:#cf3a31;
    --text:#2b3242; --ink:#141824; --muted:#5c6577; --faint:#79828f;
    --common:#6b7385; --rare:#2f7fd6; --mythic:#8b5cf6; --legendary:#c99a1a;
    --good:#1f9d57; --warn:#c9772a; --bad:#d6453f;
    --shadow:0 1px 2px rgba(20,28,48,.05),0 4px 16px rgba(20,28,48,.07);
    --shadow-lg:0 12px 34px rgba(20,28,48,.14);
    --sidebar-w:236px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(1100px 480px at 90% -140px,rgba(226,72,63,.06) 0,rgba(226,72,63,0) 70%),
      radial-gradient(900px 420px at -8% 8%,rgba(244,196,48,.08) 0,rgba(244,196,48,0) 65%),
      var(--bg);
    color:var(--text);font-family:'DM Sans',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--rune-deep);text-decoration:none;cursor:pointer;font-weight:500}
  a:hover{color:var(--gold-deep);text-decoration:underline}
  code,.mono{font-family:'DM Mono',monospace}
  ::selection{background:rgba(226,72,63,.18)}

  /* ---- left sidebar (fixed on desktop, off-canvas drawer on mobile) ------- */
  .backdrop{display:none;position:fixed;inset:0;background:rgba(20,28,48,.38);z-index:35}
  .backdrop.show{display:block}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--panel);
    border-right:1px solid var(--border);z-index:40;display:flex;flex-direction:column;
    padding:20px 14px 16px;overflow-y:auto;transition:transform .22s ease}
  .sidebar .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.07em;
    color:var(--gold-deep);text-transform:uppercase;font-size:14.5px;padding:0 6px 16px;margin-bottom:10px;
    border-bottom:1px solid var(--border)}
  .sidebar .brand .mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    color:#241a02;font-size:16px;font-weight:800;flex:none;
    background:linear-gradient(135deg,#ffdb70,var(--gold-deep));box-shadow:0 3px 12px rgba(244,196,48,.32)}
  .sidebar .brand small{color:var(--faint);font-family:'DM Mono';font-size:8.8px;letter-spacing:.16em;
    display:block;font-weight:500;text-transform:none}
  nav.tabs{display:flex;flex-direction:column;gap:2px}
  .navgrouplabel{font-family:'DM Mono';font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--faint);margin:16px 10px 5px;font-weight:600}
  .navgrouplabel:first-of-type{margin-top:6px}
  nav.tabs button{background:none;border:1px solid transparent;color:var(--muted);padding:9px 12px;
    border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.12s;text-align:left;width:100%}
  nav.tabs button.active{color:var(--ink);background:linear-gradient(90deg,rgba(226,72,63,.18),rgba(226,72,63,.02));
    border-color:rgba(226,72,63,.35);box-shadow:inset 3px 0 0 var(--rune)}
  nav.tabs button:hover{color:var(--ink);background:var(--panel-2)}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);font-size:10.5px;
    color:var(--faint);line-height:1.5}

  /* ---- top bar inside the main content area (search + mobile hamburger) -- */
  .mainarea{margin-left:var(--sidebar-w)}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.85);backdrop-filter:saturate(140%) blur(10px);
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:12px 22px}
  .hamburger{display:none;background:none;border:1px solid var(--border-2);color:var(--text);width:36px;
    height:36px;border-radius:9px;cursor:pointer;font-size:16px;flex:none;align-items:center;justify-content:center}
  .topbar .brand-mini{display:none;font-weight:800;color:var(--gold-deep);letter-spacing:.05em;font-size:14px}
  @media(max-width:960px){
    .sidebar{transform:translateX(-100%)}
    .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
    .mainarea{margin-left:0}
    .hamburger{display:flex}
    .topbar .brand-mini{display:block}
  }
  .search-wrap{margin-left:auto;display:flex;gap:8px;align-items:center;flex:1;min-width:200px;max-width:520px}
  input.search{flex:1;background:var(--panel-2);border:1px solid var(--border-2);color:var(--text);border-radius:10px;padding:9px 13px;font-size:14px;outline:none;transition:.12s}
  input.search:focus{border-color:var(--rune);box-shadow:0 0 0 3px rgba(226,72,63,.2)}
  input.search::placeholder{color:var(--faint)}
  select{background:var(--panel-2);border:1px solid var(--border-2);color:var(--text);border-radius:9px;padding:8px 10px;font-size:13px;cursor:pointer}

  .shell{max-width:1320px;margin:0 auto;padding:18px 22px 90px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:880px){.shell{grid-template-columns:1fr}}
  .col h3{font-family:'DM Mono';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:2px 0 10px}

  .list{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--border)}
  thead th{position:sticky;top:0;background:var(--panel-3);font-family:'DM Mono';font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;z-index:1}
  tbody tr{cursor:pointer;transition:background .1s}
  tbody tr:hover{background:var(--panel-2)}
  tbody tr.sel{background:linear-gradient(90deg,rgba(226,72,63,.12),rgba(226,72,63,.04));box-shadow:inset 3px 0 0 var(--rune)}
  td.mono{font-family:'DM Mono';color:var(--faint);font-size:12px}
  .badge{display:inline-block;font-family:'DM Mono';font-size:10px;font-weight:600;padding:1px 6px;border-radius:6px;border:1px solid var(--border-2);color:var(--muted);background:var(--panel-2);vertical-align:middle}
  .badge.custom{color:var(--rune-deep);border-color:rgba(226,72,63,.4);background:rgba(226,72,63,.08)}
  .badge.funmod{color:#b3691a;border-color:rgba(214,137,27,.4);background:rgba(214,137,27,.1)}
  .badge.mvp{color:#fff;border-color:transparent;background:linear-gradient(135deg,#f0b94e,#d6891b);box-shadow:0 1px 4px rgba(214,137,27,.4)}
  .scry{max-height:calc(100vh - 200px);overflow:auto;display:block}
  .count{font-size:12px;color:var(--muted);margin:8px 2px}
  /* items-tab filter/sort bar */
  .ibar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 2px 10px}
  .ichips{display:flex;flex-wrap:wrap;gap:6px}
  .ichip{background:var(--panel-2);border:1px solid var(--border-2);color:var(--muted);padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.12s;box-shadow:var(--shadow);font-family:inherit}
  .ichip:hover{color:var(--ink);background:var(--panel-2)}
  .ichip.active{color:var(--rune-deep);background:rgba(226,72,63,.1);border-color:rgba(226,72,63,.4)}
  .ibar select{padding:7px 9px;font-size:12.5px}
  .sortbtn{background:var(--panel-2);border:1px solid var(--border-2);color:var(--muted);border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);line-height:1;font-family:'DM Mono';transition:.12s}
  .sortbtn:hover{color:var(--ink);background:var(--panel-2)}

  .detail{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:20px 22px;min-height:200px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;box-shadow:var(--shadow)}
  .detail .empty{color:var(--faint);text-align:center;padding:60px 0}
  .detail h2{font-family:'DM Sans',sans-serif;font-weight:800;font-size:clamp(18px,4.5vw,22px);margin:0 0 2px;color:var(--ink);line-height:1.25;overflow-wrap:anywhere}
  .detail .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px;margin:12px 0}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;font-weight:500}
  .sec{margin-top:16px;border-top:1px solid var(--border);padding-top:13px}
  .sec h4{font-family:'DM Mono';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);margin:0 0 9px}
  pre.script{background:#f4f7fb;border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-size:12px;overflow:auto;color:#1f6b60;white-space:pre-wrap;line-height:1.5}
  .droprow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
  .droprow:last-child{border-bottom:none}
  .droprow .dl{display:flex;align-items:center;gap:8px;min-width:0}
  /* .rate is used for BOTH short numeric readouts (drop %, "3rd class") AND
     full-sentence explanatory notes — must wrap by default (long sentences
     were overflowing narrow viewports since nowrap forbids ALL line breaks,
     overriding any overflow-wrap on an ancestor). Short numeric usages that
     want to stay on one line opt in via .rate.num instead. */
  .rate{font-family:'DM Mono';color:var(--muted);font-size:12px;white-space:normal;overflow-wrap:anywhere}
  .rate.num{white-space:nowrap}
  .note{border-left:3px solid var(--rune);background:linear-gradient(90deg,rgba(226,72,63,.07),transparent);border-radius:0 8px 8px 0;padding:10px 13px;font-size:13px;margin:12px 0;color:var(--text)}
  .pill{display:inline-block;font-family:'DM Mono';font-size:11px;background:var(--panel-2);border:1px solid var(--border-2);color:var(--muted);padding:3px 9px;border-radius:999px;margin:2px 4px 2px 0}

  .loading,.errbox{max-width:680px;margin:80px auto;text-align:center;color:var(--muted)}
  .errbox code{background:var(--panel-2);padding:2px 8px;border-radius:6px;color:var(--gold-deep)}
  .systems{max-width:960px;margin:0 auto;padding:8px 4px}
  .systems h2{font-family:'DM Sans',sans-serif;font-weight:800;color:var(--gold-deep);font-size:26px}
  .syscards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.syscards{grid-template-columns:1fr}}
  .systems .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .systems .card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--rune),#ff8178)}
  .systems .card.g:before{background:linear-gradient(180deg,#e7a93a,#d6891b)}
  .systems .card h4{margin:0 0 7px;color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:800;font-size:16px;display:flex;align-items:center;gap:9px}
  .systems .card h4 .si{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:16px;background:var(--panel-2);border:1px solid var(--border);flex:none}
  .systems .card p{margin:0;font-size:13.5px;color:var(--text)}
  .hide{display:none}
  .ihead{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
  .iimg{width:62px;height:62px;flex:none;border:1px solid var(--border-2);border-radius:11px;background:var(--panel-2);object-fit:contain;padding:4px;image-rendering:pixelated}
  .iimg.hide{display:none}
  td .ico{width:22px;height:22px;vertical-align:middle;margin-right:8px;image-rendering:pixelated;flex:none}
  .eff{font-size:13.5px;margin:4px 0 4px 15px;position:relative}
  .eff:before{content:'▸';position:absolute;left:-14px;color:var(--rune)}
  .eff.cond{color:var(--gold-deep);font-weight:700;margin:11px 0 2px 0}
  .eff.cond:before{content:''}
  .dmgest-row{display:flex;align-items:center;gap:9px;margin:2px 0 9px;flex-wrap:wrap}
  .dmgest-row label{font-size:12.5px;color:var(--muted)}
  .dmgest-row input{width:100px;background:var(--panel-2);border:1px solid var(--border-2);color:var(--text);border-radius:8px;padding:6px 9px;font-size:13.5px;font-family:'DM Mono';outline:none;box-shadow:var(--shadow)}
  .dmgest-row input:focus{border-color:var(--rune);box-shadow:0 0 0 3px rgba(226,72,63,.13)}
  .dmgestline{font-size:12.5px;margin:3px 0;color:var(--text)}
  .dmgest-calc{font-family:'DM Mono';color:var(--rune-deep);font-weight:600}
  .dmgest-mini{margin-top:8px;padding-top:7px;border-top:1px dashed var(--border)}
  details.raw{margin-top:10px}
  details.raw summary{cursor:pointer;color:var(--muted);font-size:11.5px;font-family:'DM Mono';letter-spacing:.04em}

  /* ---- visual primitives ------------------------------------------------- */
  /* element chip */
  .ele{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid;line-height:1.5}
  .ele i{font-style:normal;font-size:12px}
  .ele.clk{cursor:pointer;transition:.1s}.ele.clk:hover{filter:brightness(.94);box-shadow:0 1px 4px rgba(18,28,51,.12)}
  /* element matchup */
  .emxwrap{display:flex;flex-wrap:wrap;gap:6px}
  .emx{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:8px;border:1px solid}
  .emx i{font-style:normal}.emx b{font-family:'DM Mono';font-size:11.5px}
  /* in-game loot-beam dot */
  .beamdot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 6px currentColor;display:inline-block}
  .beamleg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:3px 12px 3px 0}
  .beampill{display:inline-block;width:16px;height:30px;border-radius:4px;vertical-align:middle;
    box-shadow:inset 0 0 6px rgba(255,255,255,.18);background:linear-gradient(180deg,currentColor,transparent)}
  /* rate bar (drop rarity) */
  .ratewrap{display:flex;align-items:center;gap:7px}
  .ratebar{width:46px;height:5px;border-radius:3px;background:var(--panel-3);overflow:hidden;flex:none}
  .ratebar i{display:block;height:100%;border-radius:3px}
  /* monster stat mini-bars */
  .stats6{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 16px;margin:10px 0}
  .statb{font-size:12px}
  .statb .lab{display:flex;justify-content:space-between;color:var(--muted);font-family:'DM Mono';font-size:10.5px;letter-spacing:.04em}
  .statb .bar{height:5px;border-radius:3px;background:var(--panel-3);margin-top:2px;overflow:hidden}
  .statb .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8178,#e2483f);border-radius:3px}
  /* hp bar */
  .hpbar{height:7px;border-radius:4px;background:var(--panel-3);overflow:hidden;margin-top:4px}
  .hpbar i{display:block;height:100%;background:linear-gradient(90deg,#5fc97a,#1f9d57)}
  /* class avatar (skill changes) */
  .clsava{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
    background:radial-gradient(circle at 50% 30%,var(--panel-3),var(--panel-2));border:2px solid var(--border-2);box-shadow:var(--shadow)}
  .clsava img{width:42px;height:46px;object-fit:contain;object-position:bottom;image-rendering:pixelated;margin-bottom:-2px}
  .clsava span{font-size:22px}
  /* NPC avatar — same framed/bottom-cropped pattern as .clsava, same size so
     an NPC portrait reads as clearly as a class portrait does elsewhere on
     the site (the old 26px version was too small to actually see). */
  .npcava{width:46px;height:46px;border-radius:50%;display:inline-grid;place-items:center;overflow:hidden;
    vertical-align:middle;margin-right:9px;background:radial-gradient(circle at 50% 30%,var(--panel-3),var(--panel-2));
    border:2px solid var(--border-2);box-shadow:var(--shadow);flex:none}
  .npcava img{width:42px;height:46px;object-fit:contain;object-position:bottom;image-rendering:pixelated;margin-bottom:-2px}
  .npcrow{display:flex;align-items:center;gap:0;margin:2px 0}

  /* reward card grid — real item art, name, and one line of context. Fluid via
     auto-fill/minmax so it reflows on any width with zero breakpoints. */
  .rewardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:10px 0}
  .rewardcard{display:flex;gap:11px;align-items:center;background:var(--panel-2);border:1px solid var(--border);
    border-radius:12px;padding:10px 12px;min-width:0}
  .rewardcard .rcico{width:44px;height:44px;flex:none;border:1px solid var(--border-2);border-radius:10px;
    background:var(--panel);object-fit:contain;padding:4px;image-rendering:pixelated}
  .rewardcard .rcbody{min-width:0;flex:1}
  .rewardcard .rcname{font-weight:700;color:var(--ink);font-size:13.5px;overflow-wrap:anywhere}
  .rewardcard .rcnote{font-size:11.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
  .rewardcard .rctag{margin-top:4px}
  /* before -> after comparison */
  .cmp{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
  .cmpchip{display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:5px 9px 5px 8px;font-size:12px}
  .cmpchip .cf{color:var(--muted);font-family:'DM Mono';font-size:10px;letter-spacing:.04em;text-transform:uppercase}
  .cmpbar{position:relative;width:84px;height:14px;border-radius:4px;background:var(--panel-3);overflow:hidden;flex:none}
  .cmpbar .b4{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--border),var(--border) 3px,var(--border-2) 3px,var(--border-2) 6px);opacity:.8}
  .cmpbar .af{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
  .cmpbar.up .af{background:linear-gradient(90deg,#5fc97a,#1f9d57)}
  .cmpbar.down .af{background:linear-gradient(90deg,#6fb6ef,#2f7fd6)}
  .cmpval{font-family:'DM Mono';font-size:11.5px}
  .cmpval b{color:var(--ink)}
  .cmpval .o{color:var(--faint);text-decoration:line-through;font-size:10.5px}
  .delta{font-family:'DM Mono';font-size:11px;font-weight:700;padding:0 5px;border-radius:5px}
  .delta.g{color:var(--good);background:rgba(31,157,87,.1)}
  .delta.b{color:var(--rare);background:rgba(47,127,214,.1)}
  /* tier rail in skill changes */
  .tierhead{display:flex;align-items:center;gap:10px;margin:28px 0 14px}
  .tierhead .tn{font-family:'DM Sans',sans-serif;font-weight:800;color:var(--gold-deep);font-size:18px}
  .tierhead .tl{flex:1;height:1px;background:linear-gradient(90deg,var(--border-2),transparent)}
  .clscard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .clscard>.ch{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .clscard>.ch .cn{font-family:'DM Sans',sans-serif;font-weight:800;font-size:17px;color:var(--ink)}
  .clscard>.ch .cc{margin-left:auto;font-size:11px;color:var(--muted);font-family:'DM Mono'}
  .skrow{padding:9px 0;border-top:1px solid var(--border)}
  .skrow:first-of-type{border-top:none}
  .skrow .sn{font-weight:600;color:var(--ink)}
  .skrow .sa{color:var(--faint);font-size:11.5px;font-family:'DM Mono'}
  .skrow .sb{color:var(--muted);font-size:12px;font-style:italic}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;letter-spacing:.03em;text-transform:uppercase}
  .tag.dmg{color:#fff;background:linear-gradient(135deg,#ef8a5b,#e0794b)}
  .tag.use{color:#fff;background:linear-gradient(135deg,#5aa6ea,#2f7fd6)}
  .hero{background:linear-gradient(120deg,var(--panel-2),var(--panel));border:1px solid var(--border);border-radius:16px;padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow);display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .hero .hx{flex:1;min-width:240px}
  .hero h2{margin:0 0 4px}
  .hero p{margin:0;color:var(--muted);font-size:13.5px}
  .statline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .statbox{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:9px 14px;text-align:center;min-width:84px;box-shadow:var(--shadow)}
  .statbox b{display:block;font-size:20px;color:var(--rune-deep);font-family:'DM Sans',sans-serif;font-weight:800;line-height:1.1}
  .statbox small{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
  /* home / landing */

<script>
const $ = s => document.querySelector(s);
// left sidebar (fixed on desktop, off-canvas drawer on mobile) — toggled by
// the hamburger button and closed automatically on nav click / backdrop tap.
function toggleSidebar(force){
  const sb=$('#sidebar'), bd=$('#backdrop'); if(!sb||!bd) return;
  const open = force!==undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  bd.classList.toggle('show', open);
}
let ITEMS=[], MOBS=[], META={}, OPT={types:{},groups:[]}, ELEM=null, HUNT=null, BUILDS=null, ITEM_BY_ID=new Map(), MOB_BY_ID=new Map(), GROUP_BY_ID=new Map(), GROUP_BY_NAME=new Map(), SIBLING_BY_ID=new Map();
function gearGroup(i){
  if(i.type==='Weapon') return 'RZ_DROP_WEAPON';
  if(i.type!=='Armor') return null;
  const L=(i.loc||[]).join(' ');
  if(/Head/.test(L)) return 'RZ_DROP_HEADGEAR';
  if(/Left_Hand/.test(L)) return 'RZ_DROP_SHIELD';
  if(/Garment/.test(L)) return 'RZ_DROP_GARMENT';
  if(/Shoes/.test(L)) return 'RZ_DROP_SHOES';
  if(/Accessory/.test(L)) return 'RZ_DROP_ACCESSORY';
  if(/Armor/.test(L)) return 'RZ_DROP_ARMOR';
  return null;
}
// item icons (public Divine Pride CDN)
const IMG = id => 'https://static.divine-pride.net/images/items/collection/'+id+'.png';
const ICO = id => 'https://static.divine-pride.net/images/items/item/'+id+'.png';
// Same placeholder gotcha as monster art (see MOB_IMG below): a handful of
// genuinely-invented custom item ids with NO real stock counterpart return the
// identical fixed 5610-byte placeholder from the item CDN (verified 2026-07-13:
// 40980/40981/40982 all measured exactly 5610 bytes, vs. a real rescued item/card's
// couple-hundred-byte icon — e.g. Amdarais_Card 4601 and the Ferlock cards all
// measured ~310 bytes, real Ferlock gear 479-918 bytes). HTTP 200, so onerror can't
// catch it — skip the request outright for these known ids.
const NO_ART_ITEM_IDS = new Set([40980, 40981, 40982]);
// Donor art for the custom items above: they're re-flavored cuts of real stock
// gear, so they honestly borrow that stock item's icon. Felock_Cape_Blue (40980)
// and Felock_Cape_Red (40981) both use the real Felock_Cape (20744); Cloak Emblem
// (40982), a quest token, borrows Chivalry Emblem (1004)'s badge icon. An id in
// NO_ART_ITEM_IDS with no donor here still falls back to a token glyph (never the
// broken placeholder image the CDN returns for these ids).
const ICON_DONOR = {40980:20744, 40981:20744, 40982:1004};
const artId = id => ICON_DONOR[id] || id;
function itemIcoTag(id){
  if(NO_ART_ITEM_IDS.has(id) && !ICON_DONOR[id]) return '<span class="ico" style="display:inline-grid;place-items:center;font-size:14px;vertical-align:middle;margin-right:8px">🎫</span>';
  return `<img class="ico" src="${ICO(artId(id))}" loading="lazy" onerror="this.style.display='none'">`;
}
function itemImgTag(id){
  if(NO_ART_ITEM_IDS.has(id) && !ICON_DONOR[id]) return '<span class="iimg" style="display:grid;place-items:center;font-size:26px">🎫</span>';
  return `<img class="iimg" src="${IMG(artId(id))}" onerror="this.classList.add('hide')" alt="">`;
}
// monster portraits (same CDN). GOTCHA (verified 2026-07-13): an id with no real
// divine-pride art does NOT 404 — it returns HTTP 200 with a fixed 5610-byte
// generic placeholder image, so a plain onerror handler can't catch it (the
// request "succeeds"). Only mobs the build script has confirmed are genuine
// rAthena stock ids (mob.custom===false — present in db/pre-re OR db/re, see
// tools/build-db.js) are safe to point at this CDN directly.
const MOB_IMG = id => 'https://static.divine-pride.net/images/mobs/png/'+id+'.png';
// Reliquary Warden (31030) is a truly-invented custom mob id with no client sprite
// of its own — remapped in custom/db-import/mob_avail.yml to reuse Doppelganger's
// (1046) sprite, so its "real" in-game look is Doppelganger's art. Any OTHER
// mob.custom===true id with no entry here has no known-good art source at all, so
// it falls back to a generic emoji instead of hitting the CDN (which would only
// ever return that same placeholder).
const MOB_IMG_OVERRIDE = {31030:1046};
function mobPortrait(m){
  const emoji='👹';
  const box = src => '<span class="iimg" style="display:grid;place-items:center;overflow:hidden;padding:0">'
    +'<img src="'+src+'" alt="" loading="lazy" style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated" '
    +'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'">'
    +'<span style="display:none;place-items:center;width:100%;height:100%;font-size:28px">'+emoji+'</span></span>';
  if(!m.custom) return box(MOB_IMG(m.id));
  const ov=MOB_IMG_OVERRIDE[m.id];
  if(ov) return box(MOB_IMG(ov));
  return '<span class="iimg" style="display:grid;place-items:center;font-size:28px">'+emoji+'</span>';
}
let SKILLS = {};
function skillName(a){ return SKILLS[a] || a.replace(/^[A-Z]{1,3}_/,'').replace(/_/g,' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()); }
// friendly enchant-pool names

// ---- bonus script -> plain language ----------------------------------------
function plainEffect(script){
  const RC={RC_Formless:'Formless',RC_Undead:'Undead',RC_Brute:'Brute',RC_Plant:'Plant',RC_Insect:'Insect',RC_Fish:'Fish',RC_Demon:'Demon',RC_DemiHuman:'Demi-Human',RC_Angel:'Angel',RC_Dragon:'Dragon',RC_Player_Human:'Players',RC_All:'all races',RC_NonBoss:'non-Boss',RC_NonPlayer:'monsters'};
  const EL={Ele_Neutral:'Neutral',Ele_Water:'Water',Ele_Earth:'Earth',Ele_Fire:'Fire',Ele_Wind:'Wind',Ele_Poison:'Poison',Ele_Holy:'Holy',Ele_Dark:'Shadow',Ele_Ghost:'Ghost',Ele_Undead:'Undead',Ele_All:'all elements'};
  const SZ={Size_Small:'Small',Size_Medium:'Medium',Size_Large:'Large',Size_All:'all sizes'};
  const EF={Eff_Stun:'Stun',Eff_Freeze:'Freeze',Eff_Stone:'Stone Curse',Eff_Sleep:'Sleep',Eff_Silence:'Silence',Eff_Curse:'Curse',Eff_Poison:'Poison',Eff_Blind:'Blind',Eff_Bleeding:'Bleeding',Eff_Confusion:'Confusion'};
  const CL={Class_All:'all monsters',Class_Boss:'Boss monsters',Class_Normal:'normal monsters'};
  const out=[]; const refVars=new Set();
  for(let raw of script.split('\n')){
    let s=raw.trim();
    if(!s||/^\/\//.test(s)) continue;
    s=s.replace(/\/\/.*$/,'').replace(/;\s*$/,'').trim(); if(!s) continue;
    let m;
    if(m=/(\.@\w+)\s*=\s*getrefine\(\)/.exec(s)){ refVars.add(m[1]); continue; }  // track .@r = getrefine()
    if(/\bif\s*\(/.test(s)){
      const cm=/(getrefine\(\)|\.@\w+|BaseLevel)\s*(>=|>|==)\s*(\d+)/.exec(s);
      if(cm){
        if(cm[1]==='BaseLevel') out.push({cond:1,text:'If Base Level '+cm[3]+'+:'});
        else if(cm[1]==='getrefine()'||refVars.has(cm[1])) out.push({cond:1,text:'If refined to +'+cm[3]+' or higher:'});
      }
      const body=/\{([^}]*)\}/.exec(s);   // single-line if { bonus...; } -> translate the inline body
      if(body){
        for(let st of body[1].split(';')){ st=st.trim(); if(!st)continue; const t=translateBonus(st,{RC,EL,SZ,EF,CL}); if(t) out.push({text:t}); }
      }else{
        // 2026-07-10: the +7/+9 refine-tier kicker lines added to fun-mod headgear/MVP trophies
        // use the single-statement no-brace form (`if (getrefine()>=7) bonus2 bSkillAtk,"X",15;`)
        // instead of `if (...) { ...; }` — the brace-based extraction above finds nothing for
        // these, so the "If refined to +N or higher:" label above would render with no bonus text
        // under it. Pull the statement following the if-condition's closing paren directly.
        const sm=/^if\s*\((?:getrefine\(\)|\.@\w+|BaseLevel)\s*(?:>=|>|==)\s*\d+\)\s*(.+)$/.exec(s);
        if(sm){ const st=sm[1].trim(); if(st){ const t=translateBonus(st,{RC,EL,SZ,EF,CL}); if(t) out.push({text:t}); } }
      }
      continue;
    }
    if(/^[}{]|^\.@|^(else|for|while|set\b|switch|case|default|deletearray|setarray|end|return)/.test(s)) continue;
    const t=translateBonus(s,{RC,EL,SZ,EF,CL}); if(t) out.push({text:t});
  }
  return out;
}
// ---- damage-delta estimator: pull flat-% bSkillAtk amps out of a raw script -----
// (same line-scanning approach as plainEffect above, reused so the estimator never
// drifts from what the "Effect" section already displays; only plain integer %
// amps are estimable — BaseLevel/refine-scaling lines are skipped)
function skillAtkAmps(script){
  if(!script) return [];
  const out=[];
  for(let raw of script.split('\n')){
    let s=raw.trim();
    if(!s||/^\/\//.test(s)) continue;
    s=s.replace(/\/\/.*$/,'').replace(/;\s*$/,'').trim(); if(!s) continue;
    // 2026-07-10 audit: skip +7/+9 refine-tier kicker lines (`if (getrefine()>=7) bonus2
    // bSkillAtk,...`) — this estimator treats every match as an unconditional "with this item"
    // bonus, so counting a tier line here would silently inflate the shown total (e.g. Mirror
    // Shield would show 3 separate Holy Cross lines instead of 1 base line). The conditional
    // "Effect" section (plainEffect, below) still shows these correctly as refine-gated.
    if(/getrefine/.test(s)) continue;
    const m=/bonus2 bSkillAtk,"([A-Z_0-9]+)",(-?\d+)$/.exec(s);
    if(m) out.push({skill:m[1], name:skillName(m[1]), pct:+m[2]});
  }
  return out;
}
function estLine(pct,base){ base=base||1000; return base.toLocaleString()+' → '+Math.round(base*(1+pct/100)).toLocaleString()+' (+'+pct+'%)'; }
// recompute every ".dmgest-calc" node inside scopeSel from the #inputId value — used by
// both the item-detail widget and the Fun Builds tab (one shared input per scope)
function refreshDmgEst(scopeSel,inputId){
  const root=document.querySelector(scopeSel), inp=document.getElementById(inputId);
  if(!root||!inp) return;
  const v=Math.max(0,+inp.value||0);
  root.querySelectorAll('.dmgest-calc').forEach(el=>{ el.textContent=estLine(+el.dataset.pct,v); });
}
function valFmt(v){ v=String(v).trim(); if(/^-?\d+$/.test(v)) return (+v>=0?'+':'')+v; if(/BaseLevel/.test(v)) return '(scales with Base Level)'; if(/getrefine/.test(v)) return '(scales with refine)'; return '+'+v; }

function translateBonus(s,M){

  let m;

  if(m=/bonus2 bSkillCooldown,"([A-Z_0-9]+)",(-?\d+)/.exec(s)) return sk(m[1])+' cooldown '+ (+m[2]/1000)+'s';
  if(m=/bonus2 bSkillUseSP(?:rate)?,"([A-Z_0-9]+)",(-?\d+)/.exec(s)) return sk(m[1])+' SP cost '+m[2]+(/rate/.test(s)?'%':'');
  if(m=/bonus2 bVariableCastrate,"([A-Z_0-9]+)",(-?\d+)/.exec(s)) return sk(m[1])+' variable cast '+m[2]+'%';
  // race/size/element add & sub

  if(m=/bonus2 bSubRace2?,(RC_\w+),(-?\d+)/.exec(s)) return 'Damage taken from '+(M.RC[m[1]]||m[1])+' race '+(-m[2])+'%';
  if(m=/bonus2 b(Magic)?AddSize,(Size_\w+),(-?\d+)/.exec(s)) return (m[1]?'Magic d':'D')+'amage to '+(M.SZ[m[2]]||m[2])+' size +'+m[3]+'%';
  if(m=/bonus2 bSubSize,(Size_\w+),(-?\d+)/.exec(s)) return 'Damage taken from '+(M.SZ[m[1]]||m[1])+' size '+(-m[2])+'%';
  if(m=/bonus2 b(Magic)?AddEle,(Ele_\w+),(-?\d+)/.exec(s)) return (m[1]?'Magic d':'D')+'amage to '+(M.EL[m[2]]||m[2])+' property +'+m[3]+'%';
  if(m=/bonus2 bSubEle,(Ele_\w+),(-?\d+)/.exec(s)) return (M.EL[m[1]]||m[1])+' resistance +'+m[2]+'%';
  if(m=/bonus2 b(Magic)?AddClass,(Class_\w+),(-?\d+)/.exec(s)) return (m[1]?'Magic d':'D')+'amage to '+(M.CL[m[2]]||m[2])+' +'+m[3]+'%';
  if(m=/bonus2 bSubClass,(Class_\w+),(-?\d+)/.exec(s)) return 'Damage taken from '+(M.CL[m[1]]||m[1])+' '+(-m[2])+'%';
  if(m=/bonus2 bResEff,(Eff_\w+),(-?\d+)/.exec(s)) return (M.EF[m[1]]||m[1])+' resistance +'+(m[2]/100)+'%';
  if(m=/bonus2 bAddEff(?:WhenHit)?,(Eff_\w+),(-?\d+)/.exec(s)) return (m[2]/100)+'% chance to inflict '+(M.EF[m[1]]||m[1])+(/WhenHit/.test(s)?' when hit':'');
  if(m=/bonus2 bSkillHeal2?,"([A-Z_0-9]+)",(-?\d+)/.exec(s)) return sk(m[1])+' healing +'+m[2]+'%';
  if(m=/bonus2 bHPDrainValue,(-?\d+)/.exec(s)) return 'Recover '+m[1]+' HP per attack';
  if(m=/bonus2 bSPDrainValue,(-?\d+)/.exec(s)) return 'Recover '+m[1]+' SP per attack';
  if(m=/bonus2 bExpAddRace,(RC_\w+),(-?\d+)/.exec(s)) return 'EXP from '+(M.RC[m[1]]||m[1])+' race +'+m[2]+'%';
  if(m=/bonus2 bDropAddRace,(RC_\w+),(-?\d+)/.exec(s)) return 'Drop rate from '+(M.RC[m[1]]||m[1])+' race +'+m[2]/100+'%';
  if(m=/bonus2 bIgnoreDefRace,(RC_\w+)/.exec(s)) return 'Ignore DEF of '+(M.RC[m[1]]||m[1])+' race';
  if(m=/bonus2 bWeaponAtk\w*,(\d+),(-?\d+)/.exec(s)) return 'Weapon ATK +'+m[2];
  if(m=/bonus3 bAutoSpell\w*,"([A-Z_0-9]+)",(\d+),(\d+)/.exec(s)) return (m[3]/100)+'% chance to autocast '+sk(m[1])+' Lv'+m[2];
  if(m=/bonus3 bAddEff\w*,(Eff_\w+),(\d+)/.exec(s)) return (m[2]/100)+'% chance to inflict '+(M.EF[m[1]]||m[1]);
  // simple stat / flat bonuses
  const S={bStr:'STR',bAgi:'AGI',bVit:'VIT',bInt:'INT',bDex:'DEX',bLuk:'LUK',bAllStats:'All Stats',
    bMaxHP:'Max HP',bMaxSP:'Max SP',bBaseAtk:'ATK',bMatk:'MATK',bDef:'DEF',bMdef:'MDEF',bCritical:'Critical',
    bHit:'Hit',bFlee:'Flee',bFlee2:'Perfect Dodge',bAspd:'ASPD'};
  if(m=/bonus (b\w+),(-?\d+)/.exec(s)){

    if(P[k]) return P[k]+' '+(+v>=0?'+':'')+v+'%';
    const N={bVariableCastrate:'Variable Cast',bFixedCastrate:'Fixed Cast',bDelayrate:'After-cast Delay',bUseSPrate:'SP Cost',bCastrate:'Cast Time'};

    if(k==='bShortWeaponDamageReturn') return 'Reflect '+v+'% melee damage';
    if(k==='bLongWeaponDamageReturn') return 'Reflect '+v+'% ranged damage';

    if(k==='bMagicAtkDef'||k==='bMagicSubDefEle') return 'Magic damage taken -'+v+'%';
    if(k==='bAddMaxWeight') return 'Max Weight +'+(v/10);
    if(k==='bPerfectHitRate') return 'Perfect Hit +'+v+'%';
  }
  // flagged bonuses (no value)
  const F={bUnbreakableWeapon:'Weapon is indestructible',bUnbreakableArmor:'Armor is indestructible',bUnbreakableHelm:'Headgear is indestructible',bUnbreakableShield:'Shield is indestructible',bUnbreakableGarment:'Garment is indestructible',bUnbreakableShoes:'Footgear is indestructible',bNoSizeFix:'Ignores the size damage penalty',bNoCastCancel:'Casting cannot be interrupted',bNoWalkDelay:'No movement delay when hit',bNoKnockback:'Immune to knockback'};

  return null; // unrecognised (multi-arg/complex) -> stays in the raw script
}

function armorSlotOf(loc){
  const L=(loc||[]).join(' ');
  if(/Head/.test(L)) return 'Headgear';

  if(/Garment/.test(L)) return 'Garment';

function eleMatchup(el,lv){
  if(!ELEM||el==null) return '';
  const defIdx=eleIdx(el), L=Math.min(3,Math.max(0,(lv||1)-1));
  const rows=ELEM.order.map((_,atk)=>({atk,pct:ELEM.matrix[L][atk][defIdx]})).sort((a,b)=>b.pct-a.pct);

    const lbl = p<0?'heals' : p===0?'immune' : p+'%';
    return `<span class="emx" style="border-color:${col}55;background:${col}12;color:${col}"><i style="color:${ELE_C[i]}">${ELE_I[i]}</i>${ELE[i]} <b>${lbl}</b></span>`;

const BEAM={blue:'#3a8fe0',yellow:'#e3c038',purple:'#a45bd6',green:'#2fa85f',red:'#e0473f'};
function dropBeam(itemId,rate,ctx){
  const it=ITEM_BY_ID.get(itemId); if(!it) return null;
  if(it.type==='Card'){ return ctx&&ctx.srcMvp ? {c:BEAM.purple,t:'MVP-card beam'} : {c:BEAM.blue,t:'card beam'}; }
  if(it.type==='Weapon'||it.type==='Armor'){
    if((ctx&&ctx.prize)||rate<=10) return {c:BEAM.red,t:'rare-gear beam'};
    if(rate<=100) return {c:BEAM.green,t:'gear beam'};
  }
  return null;
}
function beamDot(b){return b?`<span class="beamdot" style="color:${b.c}" title="${b.t}"></span>`:'';}

// rarity bar from a drop rate (0.01% units; rarer = fuller + hotter colour)
function rarity(rate){
  if(rate<=10) return {p:100,c:'#df8a1e',n:'legendary'};
  if(rate<=50) return {p:82,c:'#8b5cf6',n:'very rare'};
  if(rate<=100) return {p:64,c:'#2f7fd6',n:'rare'};
  if(rate<=1000) return {p:42,c:'#13a99a',n:'uncommon'};
  return {p:22,c:'#9aa2b4',n:'common'};
}
function rateBar(rate){const r=rarity(rate);return `<span class="ratewrap"><span class="ratebar" title="${r.n}"><i style="width:${r.p}%;background:${r.c}"></i></span><span class="rate num">${pct(rate)}</span></span>`;}
function statBar(v,max){const p=Math.max(4,Math.min(100,Math.round(v/max*100)));return `<div class="bar"><i style="width:${p}%"></i></div>`;}

async function boot(){
  try{
    const [it,mo,me,op,sk,el,hu,bd] = await Promise.all([
      fetch('data/items.json').then(r=>{if(!r.ok)throw 0;return r.json()}),
      fetch('data/mobs.json').then(r=>r.json()),
      fetch('data/meta.json').then(r=>r.json()),
      fetch('data/options.json').then(r=>r.json()),
      fetch('data/skills.json').then(r=>r.json()).catch(()=>({})),
      fetch('data/elements.json').then(r=>r.json()).catch(()=>null),
      fetch('data/hunting.json').then(r=>r.json()).catch(()=>null),
      fetch('data/builds.json').then(r=>r.json()).catch(()=>null),
    ]);
    ITEMS=it; MOBS=mo; META=me; OPT=op; SKILLS=sk; ELEM=el; HUNT=hu; BUILDS=bd;
    ITEMS.forEach(i=>{i._s=(i.name+' '+(i.aegis||'')+' '+i.id+' '+(i.boosts||[]).map(b=>b.skill).join(' ')).toLowerCase(); ITEM_BY_ID.set(i.id,i);});
    MOBS.forEach(m=>{m._s=(m.name+' '+(m.aegis||'')+' '+m.id+' '+ELE[eleIdx(m.element)]+' '+(m.element||'')+' '+RACE[raceIdx(m.race)]+' '+(m.size||'')+(m.mvp?' mvp':'')).toLowerCase(); MOB_BY_ID.set(m.id,m);});
    OPT.groups.forEach(g=>{g._s=(g.name).toLowerCase(); GROUP_BY_ID.set(g.id,g); GROUP_BY_NAME.set(g.name,g);});
    if(BUILDS&&BUILDS.groups) BUILDS.groups.forEach(g=>g.builds.forEach(f=>{
      if(f.items.length===2){ const [a,b]=f.items; SIBLING_BY_ID.set(a.id,b); SIBLING_BY_ID.set(b.id,a); }
    }));
    initUI();
  }catch(e){
    $('#app').innerHTML='<div class="errbox"><h2 style="color:var(--gold-deep);font-family:DM Sans;font-weight:800">Couldn’t load the data files</h2>'
      +'<p>Browsers block <code>fetch()</code> of local files. Serve this folder over http:</p>'
      +'<p><code>npx serve wiki</code> &nbsp;or&nbsp; <code>python -m http.server</code> (then open the shown URL).</p>'
      +'<p style="color:var(--muted);font-size:12px">Hosting it (GitHub Pages, Netlify, any static host) also works.</p></div>';
  }
}

    +'<div class="ibar hide" id="itemBar">'
      +'<div class="ichips" id="typeChips"></div>'
      +'<select id="subFilter" class="hide"></select>'
      +'<select id="slotFilter" class="hide"></select>'
      +'<select id="sortField"></select>'
      +'<button class="sortbtn" id="sortDir" type="button" title="Toggle ascending/descending">↑ Asc</button>'
    +'</div>'
    +'<div class="count" id="count"></div><div class="list"><div class="scry"><table>'
    +'<thead id="thead"></thead><tbody id="rows"></tbody></table></div></div></div>'
    +'<div class="col"><h3>Detail</h3><div class="detail" id="detail"><div class="empty">Select an entry to view details.</div></div></div></div>'
    +'<div class="systems hide" id="systems"></div>'
    +'<div class="systems hide" id="balance"></div>'
    +'<div class="hide" id="hunting"></div>'
    +'<div class="hide" id="builds"></div>'
    +'<div class="hide" id="home"></div>'
    +'<div class="hide" id="rates"></div>'

function setView(v){
  view=v;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  const isPanel = (v==='systems'||v==='balance'||v==='home'||v==='hunting'||v==='builds'||v==='rates'||v==='customizations'||v==='classes'||v==='instances');
  $('#searchWrap').style.visibility = isPanel?'hidden':'visible';
  $('#browse').classList.toggle('hide', isPanel);
  $('#systems').classList.toggle('hide', v!=='systems');
  $('#balance').classList.toggle('hide', v!=='balance');
  $('#home').classList.toggle('hide', v!=='home');
  $('#hunting').classList.toggle('hide', v!=='hunting');
  $('#builds').classList.toggle('hide', v!=='builds');
  $('#rates').classList.toggle('hide', v!=='rates');
  $('#customizations').classList.toggle('hide', v!=='customizations');
  $('#classes').classList.toggle('hide', v!=='classes');
  $('#instances').classList.toggle('hide', v!=='instances');
  $('#itemBar').classList.toggle('hide', v!=='items');
  if(v==='home'||v==='hunting'||v==='builds'||v==='rates'||v==='customizations'||v==='classes') return;
  if(v==='balance'){ renderBalance(); return; }
  if(v==='instances'){ renderInstances(); return; }
  if(v==='systems') return;
  // type filter options
  const f=$('#filterType'); f.innerHTML='';
  const opts = v==='items'
    ? ['All types','Custom','Fun Mods']   // Weapon/Armor/Card/etc. type slicing now lives in the Items-tab filter bar (#itemBar) below
    : v==='mobs' ? ['All','MVP only','Normal only']
    : v==='skills' ? ['Trans skills (up to ep13)']
    : ['Rune Zero','All groups'];
  opts.forEach(o=>{const e=document.createElement('option');e.textContent=o;f.appendChild(e);});
  $('#listTitle').textContent = v==='items'?'Items':v==='mobs'?'Monsters':v==='skills'?'Skill-Boosting Items':'Enchant / Option Pools';
  $('#thead').innerHTML = v==='items'
    ? '<tr><th>ID</th><th>Name</th><th>Type</th><th>Slot</th></tr>'
    : v==='mobs' ? '<tr><th>ID</th><th>Lv</th><th>Name</th><th>Element</th></tr>'
    : v==='skills' ? '<tr><th>ID</th><th>Item</th><th>Boosts skill(s)</th><th>Tier</th></tr>'
    : '<tr><th>ID</th><th>Group</th><th>Options</th><th>Source</th></tr>';
  render();
}

function render(){
  const q=$('#search').value.trim().toLowerCase(), ft=$('#filterType').value;
  const rows=$('#rows'); let out='', n=0, total=0;
  if(view==='items'){
    let list=[];
    for(const i of ITEMS){
      if(q && !i._s.includes(q)) continue;
      if(ft==='Custom' && !i.custom) continue;
      if(ft==='Fun Mods' && !i.funmod) continue;
      if(itemFlt.type && i.type!==itemFlt.type) continue;
      if(itemFlt.type==='Weapon' && itemFlt.sub && i.sub!==itemFlt.sub) continue;
      if(itemFlt.type==='Armor' && itemFlt.slot && armorSlotOf(i.loc)!==itemFlt.slot) continue;
      list.push(i);
    }
    total=list.length;
    if(itemFlt.sort){
      const dir=itemFlt.dir==='desc'?-1:1;
      list=list.slice().sort((a,b)=>{
        if(itemFlt.sort==='name') return dir*String(a.name||'').localeCompare(String(b.name||''));
        const av=a[itemFlt.sort]??0, bv=b[itemFlt.sort]??0;
        return dir*(av-bv);
      });
    }
    for(const i of list){
      if(n>=300) break;
      out+=`<tr data-id="${i.id}"><td class="mono">${i.id}</td><td>${itemIcoTag(i.id)}${esc(i.name)} ${i.custom?'<span class="badge custom">RZ</span>':''}${i.funmod?'<span class="badge funmod">FUN</span>':''}${i.slots?` <span class="badge">[${i.slots}]</span>`:''}</td><td>${i.type||''}</td><td>${(i.loc||[]).join(', ')||'-'}</td></tr>`;n++;
    }
  }else if(view==='mobs'){
    for(const m of MOBS){
      if(q && !m._s.includes(q)) continue;
      if(ft==='MVP only' && !m.mvp) continue;
      if(ft==='Normal only' && m.mvp) continue;
      total++; if(n<300){out+=`<tr data-id="${m.id}"><td class="mono">${m.id}</td><td class="mono">${m.lvl||''}</td><td>${esc(m.name)} ${m.mvp?'<span class="badge mvp">MVP</span>':''}</td><td>${eleChip(m.element,m.eleLv)}</td></tr>`;n++;}
    }
  }else if(view==='skills'){
    for(const i of ITEMS){
      if(!i.boosts||!i.boosts.length) continue;
      const trans=i.boosts.filter(b=>!b.t3);
      if(!trans.length) continue;                 // ep13 server: hide pure-3rd-class items
      if(q && !i._s.includes(q)) continue;
      total++; if(n<300){
        const has3=i.boosts.some(b=>b.t3);
        const skn=trans.map(b=>skillName(b.skill)).slice(0,3).join(', ')+(trans.length>3?' +'+(trans.length-3):'');
        const tier=has3?'<span class="badge">+3rd</span>':'<span class="badge">Trans</span>';
        out+=`<tr data-id="${i.id}"><td class="mono">${i.id}</td><td>${itemIcoTag(i.id)}${esc(i.name)} ${i.custom?'<span class="badge custom">RZ</span>':''}${i.funmod?'<span class="badge funmod">FUN</span>':''}</td><td style="font-size:12px">${esc(skn)}</td><td>${tier}</td></tr>`;n++;
      }
    }
  }else{ // enchants
    for(const g of OPT.groups){
      if(q && !g._s.includes(q)) continue;
      if(ft==='Rune Zero' && !g.name.startsWith('RZ_')) continue;
      total++; if(n<300){out+=`<tr data-id="${g.id}"><td class="mono">${g.id}</td><td>${esc(friendlyGroup(g.name))} ${g.name.startsWith('RZ_')?'<span class="badge custom">RZ</span>':''}</td><td class="mono">${g.options.length}</td><td>${g.name.startsWith('RZ_')?'Rune Zero':'Base'}</td></tr>`;n++;}
    }
  }
  rows.innerHTML=out||'<tr><td colspan="4" style="color:var(--muted);padding:24px;text-align:center">No matches.</td></tr>';
  $('#count').textContent = `${total.toLocaleString()} ${view==='enchants'?'group':'match'}${total!==1?(view==='enchants'?'s':'es'):''}${total>300?' (showing first 300 — refine your search)':''}`;
  const pre = view==='items'?'item/':view==='mobs'?'mob/':view==='skills'?'item/':'group/';
  rows.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{ location.hash = pre+tr.dataset.id; });
}

const VIEWS=['home','items','builds','mobs','skills','enchants','hunting','systems','balance','rates','customizations','classes','instances'];
function routeHash(){
  const h=location.hash.slice(1);
  if(h.startsWith('item/')){ if(view==='systems')setView('items'); showItem(+h.slice(5)); }
  else if(h.startsWith('mob/')){ showMob(+h.slice(4)); }
  else if(h.startsWith('group/')){ showGroup(+h.slice(6)); }
  else if(h.startsWith('instance/')){ setView('instances'); renderInstanceDetail(h.slice(9)); }
  else if(VIEWS.includes(h)){ setView(h); }   // shareable tab links e.g. #balance
}

function showGroup(id){
  const g=GROUP_BY_ID.get(id); if(!g)return;
  if(view!=='enchants'){view='enchants';setView('enchants');}
  highlight(id);
  let h=`<h2>${esc(friendlyGroup(g.name))} ${g.name.startsWith('RZ_')?'<span class="badge custom">Rune Zero</span>':''}</h2>`;
  h+=`<div class="sub mono">${esc(g.name)} · ${g.options.length} options · up to ${g.maxRandom} random</div>`;
  const fixed=g.options.filter(o=>o.fixed), rnd=g.options.filter(o=>!o.fixed);
  const rowOpt=o=>{const t=OPT.types[o.name]||{}; const d=(t.desc||o.name).replace('+N',(o.min===o.max?'+'+o.min:'+'+o.min+'–'+o.max)).replace('-N','-'+(o.min===o.max?o.min:o.min+'–'+o.max));
    return `<div class="droprow"><span>${esc(d)}</span><span class="rate num">${(o.chance/100).toFixed(o.chance%100?2:0)}%</span></div>`;};
  if(fixed.length){h+='<div class="sec"><h4>Guaranteed slot — one of</h4>'+fixed.map(rowOpt).join('')+'</div>';}
  if(rnd.length){h+=`<div class="sec"><h4>Random extras (up to ${g.maxRandom})</h4>`+rnd.map(rowOpt).join('')+'</div>';}
  if(g.name.startsWith('RZ_DROP_'))h+='<div class="note">Auto-applied to dropped '+g.name.replace('RZ_DROP_','').toLowerCase()+' gear. The option count drives the floor drop-beam color.</div>';
  $('#detail').innerHTML=h;
}

function showItem(id){
  const i=ITEM_BY_ID.get(id); if(!i)return;
  if(view!=='items' && view!=='skills'){view='items';setView('items');}  // stay on Skill Items tab when browsing it
  highlight(id);
  let h=`<div class="ihead">${itemImgTag(i.id)}<div><h2>${esc(i.name)} ${i.custom?'<span class="badge custom">Rune Zero</span>':''}${i.funmod?'<span class="badge funmod">Fun Mod</span>':''}</h2><div class="sub mono">ID ${i.id} · ${esc(i.aegis||'')}</div></div></div>`;
  h+='<dl class="kv">';
  h+=row('Type', i.type + (i.sub?` (${i.sub})`:''));
  if(i.slots)h+=row('Card slots', i.slots);
  if(i.loc&&i.loc.length)h+=row('Equip', i.loc.join(', '));
  if(i.atk!=null)h+=row('ATK', i.atk);
  if(i.matk!=null)h+=row('MATK', i.matk);
  if(i.def!=null)h+=row('DEF', i.def);
  if(i.wlv!=null)h+=row('Weapon Lv', i.wlv);
  if(i.alv!=null)h+=row('Armor Lv', i.alv);
  if(i.weight!=null)h+=row('Weight', (i.weight/10).toFixed(1));
  if(i.refine!=null)h+=row('Refineable', i.refine?'Yes':'No');
  h+=row('Jobs', (i.jobs&&i.jobs.length)?i.jobs.join(', '):'All');
  h+='</dl>';
  if(i.boosts&&i.boosts.length){
    h+='<div class="sec"><h4>Boosts skills</h4>';
    for(const b of i.boosts) h+=`<div class="droprow"><span>${esc(skillName(b.skill))}</span><span class="rate num">${b.t3?'3rd class':'up to trans'}</span></div>`;
    h+='</div>';
  }
  if(i.script){
    const pe=plainEffect(i.script);
    h+='<div class="sec"><h4>Effect</h4>';
    if(pe.length) h+=pe.map(l=>`<div class="eff${l.cond?' cond':''}">${esc(l.text)}</div>`).join('');
    else h+='<div class="eff" style="margin-left:0">A special effect — see the script below.</div>';
    h+=`<details class="raw"><summary>▸ Show raw script</summary><pre class="script">${esc(i.script)}</pre></details></div>`;
  }
  if(i.funmod){
    const amps=skillAtkAmps(i.script);
    if(amps.length){
      h+='<div class="sec" id="dmgest-sec"><h4>Estimate</h4>';
      h+='<div class="dmgest-row"><label for="dmgestInput">Your skill’s current average hit</label><input type="number" id="dmgestInput" min="0" step="1" value="1000" oninput="refreshDmgEst(\'#dmgest-sec\',\'dmgestInput\')"></div>';
      for(const a of amps) h+=`<div class="dmgestline">${esc(a.name)} — with this item: <span class="dmgest-calc" data-pct="${a.pct}">${estLine(a.pct)}</span></div>`;
      const sib=SIBLING_BY_ID.get(i.id);
      if(sib){
        const isSlotted=/_$/.test(i.aegis||'');
        h+= isSlotted
          ? `<div class="rate" style="margin-top:6px">This is the slotted twin — already the <a onclick="location.hash='item/${sib.id}'">~2x</a> version of this amp.</div>`
          : `<div class="rate" style="margin-top:6px">The <a onclick="location.hash='item/${sib.id}'">slotted version</a> roughly doubles this.</div>`;
      }
      h+='</div>';
    }
  }
  if(i.combos&&i.combos.length){
    h+='<div class="sec"><h4>Set combo</h4>';
    for(const c of i.combos){
      const withnames=c.with.map(w=>`<a onclick="location.hash='item/${w.id}'">${esc(w.name)}</a>`).join(' + ');
      h+=`<div class="droprow" style="display:block"><div style="margin-bottom:4px">Worn with ${withnames}:</div>`;
      const pe=plainEffect(c.script);
      h+=(pe.length?pe:[{text:c.script,cond:false}]).map(l=>`<div class="eff${l.cond?' cond':''}">${esc(l.text)}</div>`).join('');
      h+='</div>';
    }
    h+='</div>';
  }
  // dropped by
  const db=(i.droppedBy||[]).slice().sort((a,b)=>b.rate-a.rate);
  if(db.length){
    h+='<div class="sec"><h4>Dropped by</h4>';
    for(const d of db.slice(0,40)){ const b=dropBeam(i.id,d.rate,{srcMvp:d.mvp}); h+=`<div class="droprow"><span class="dl">${beamDot(b)}<a onclick="location.hash='mob/${d.id}'">${esc(d.mob)}</a> ${d.mvp?'<span class="badge mvp">★ MVP</span>':''}</span>${rateBar(d.rate)}</div>`; }
    if(db.length>40)h+=`<div class="rate" style="margin-top:6px">…and ${db.length-40} more</div>`;
    h+='</div>';
  }
  // possible enchants / random options (equipment, Zero-native)
  const gg=gearGroup(i), grp=gg&&GROUP_BY_NAME.get(gg);
  if(grp){
    h+=`<div class="sec"><h4>Possible random options (on drop)</h4>`;
    h+=`<div style="font-size:13px">When this drops it can roll options from <a onclick="location.hash='group/${grp.id}'">${esc(friendlyGroup(gg))}</a> — up to ${grp.maxRandom+1}. The option count sets the floor beam color (3 green · 4 purple · 5 gold).</div>`;
    if(!db.length)h+='<div class="rate" style="margin-top:6px">No fixed monster drop — obtain via forging, drops, or shops.</div>';
    h+='</div>';
  }
  $('#detail').innerHTML=h;
}

function showMob(id){
  const m=MOB_BY_ID.get(id); if(!m)return;
  if(view!=='mobs'){view='mobs';setView('mobs');}
  highlight(id);
  let h=`<div class="ihead">${mobPortrait(m)}<div><h2>${esc(m.name)} ${m.mvp?'<span class="badge mvp">★ MVP</span>':''}</h2><div class="sub mono">ID ${m.id} · ${esc(m.aegis||'')}</div></div></div>`;

  // HP bar (log-scaled: 100 .. 10M)

  h+='<dl class="kv">';

  h+='</dl>';
  if(m.stats){const S=m.stats,smax=Math.max(120,S.str,S.agi,S.vit,S.int,S.dex,S.luk);
    h+='<div class="stats6">'+[['STR',S.str],['AGI',S.agi],['VIT',S.vit],['INT',S.int],['DEX',S.dex],['LUK',S.luk]]
      .map(([n,v])=>`<div class="statb"><div class="lab"><span>${n}</span><span>${v}</span></div>${statBar(v,smax)}</div>`).join('')+'</div>';}
  h+=eleMatchup(m.element,m.eleLv);
  const dRow=(d,ctx)=>{const b=dropBeam(d.id,d.rate,ctx);return `<div class="droprow"><span class="dl">${beamDot(b)}${d.id?`<a onclick="location.hash='item/${d.id}'">${esc(d.name)}</a>`:esc(d.name)}</span>${rateBar(d.rate)}</div>`;};
  const drops=(m.drops||[]).slice().sort((a,b)=>b.rate-a.rate);
  if(drops.length){h+='<div class="sec"><h4>Drops</h4>';for(const d of drops)h+=dRow(d,{srcMvp:m.mvp});h+='</div>';}
  if(m.mvpDrops&&m.mvpDrops.length){h+='<div class="sec"><h4>★ MVP Reward</h4>';for(const d of m.mvpDrops)h+=dRow(d,{srcMvp:m.mvp,prize:true});h+='</div>';}
  if(m.spawns&&m.spawns.length){
    h+='<div class="sec"><h4>Spawns</h4>';
    for(const s of m.spawns.slice(0,30)) h+=`<div class="droprow"><span class="mono">${esc(s.map)}</span><span class="rate num">${s.amt}</span></div>`;
    if(m.spawns.length>30)h+=`<div class="rate" style="margin-top:6px">…and ${m.spawns.length-30} more maps</div>`;
    h+='</div>';
  }
  $('#detail').innerHTML=h;
}
function dropLink(d){return `<div class="droprow">${d.id?`<a onclick="location.hash='item/${d.id}'">${esc(d.name)}</a>`:esc(d.name)}<span class="rate num">${pct(d.rate)}</span></div>`;}

function highlight(id){

// Class job sprite (animated .gif in assets/classes/<key>.gif). Key = class name
// lowercased, spaces/slashes -> '-'. Falls back to an emoji if the sprite is absent.
function clsIcon(cls){
  const key=cls.toLowerCase().replace(/[\/ ]+/g,'-');
  const emoji=CLASS_EMOJI[cls]||'🔰';
  return '<span class="clsava"><img src="assets/classes/'+key+'.gif" alt="'+esc(cls)+'" loading="lazy" '
    +'onerror="this.style.display=\'none\';this.parentNode.querySelector(\'span\').style.display=\'grid\'">'
    +'<span style="display:none;place-items:center;width:100%;height:100%">'+emoji+'</span></span>';
}

let BALANCE=null;
async function renderBalance(){
  const el=$('#balance');
  const be=x=>String(x).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  if(!BALANCE){
    el.innerHTML='<div style="padding:24px;color:var(--muted)">Loading skill changes…</div>';
    try{ BALANCE=await fetch('data/skillchanges.json').then(r=>r.json()); }
    catch(e){ el.innerHTML='<div style="padding:24px">Could not load <code>data/skillchanges.json</code>.</div>'; return; }
  }
  const tierName=['Novice','1st Class','2nd Class','Transcendent','Expanded'];
  const FIELD={CastTime:['Cast','ms'],FixedCastTime:['Fixed cast','ms'],AfterCastActDelay:['Delay','ms'],AfterCastWalkDelay:['Walk delay','ms'],Cooldown:['Cooldown','ms'],SpCost:['SP',''],SP:['SP',''],HpRateCost:['HP cost','%'],ZenyCost:['Zeny','z'],ItemCost:['Items','']};
  const num=x=>{const m=/-?\d+(\.\d+)?/.exec(String(x));return m?parseFloat(m[0]):null;};
  const lvCoef=x=>{const m=/(\d+)\s*\*\s*lv/i.exec(String(x));return m?+m[1]:null;};
  // visual before->after bar: track sized to max(before,after); hatched ghost=before, colour=after
  function cmpBar(before,after,dir){ // dir 'up'(green, bigger=better) | 'down'(blue, smaller=better)
    const mx=Math.max(before,after,1)||1;
    return `<span class="cmpbar ${dir}"><span class="b4" style="width:${Math.round(before/mx*100)}%"></span><span class="af" style="width:${Math.round(after/mx*100)}%"></span></span>`;
  }
  function usChip(u){
    const f=FIELD[u.field]||[u.field,''], b=num(u.before), a=num(u.after);
    let bar='',delta='';
    if(b!=null&&a!=null&&b>0){ bar=cmpBar(b,a,'down'); const d=Math.round((a/b-1)*100); if(d!==0) delta=`<span class="delta b">${d>0?'+':''}${d}%</span>`; }
    return `<span class="cmpchip"><span class="cf">${be(f[0])}</span>${bar}<span class="cmpval"><span class="o">${be(u.before)}${f[1]}</span> <b>${be(u.after)}${f[1]}</b></span>${delta}</span>`;
  }
  function dmgChip(d){
    const b=lvCoef(d.before), a=lvCoef(d.after); let bar='',delta='';
    if(b!=null&&a!=null&&b>0){ bar=cmpBar(b,a,'up'); const g=Math.round((a/b-1)*100); if(g) delta=`<span class="delta g">${g>0?'+':''}${g}%</span>`; }
    return `<span class="cmpchip"><span class="cf" style="color:var(--warn)">DMG /lv</span>${bar}<span class="cmpval"><span class="o">${be(d.before)}</span> <b>${be(d.after)}</b></span>${delta}</span>`;
  }
  const groups={};
  BALANCE.forEach(s=>{const k=s.classOrder+'|'+s.class;(groups[k]=groups[k]||[]).push(s);});
  const keys=Object.keys(groups).sort((a,b)=>{const ao=+a.split('|')[0],bo=+b.split('|')[0];return ao-bo||a.split('|')[1].localeCompare(b.split('|')[1]);});
  const usab=BALANCE.filter(s=>s.usability&&s.usability.length).length, dmg=BALANCE.filter(s=>s.damage).length;
  let h='<div style="max-width:1100px;margin:0 auto;padding:8px 4px 50px">'
    +'<div class="hero"><div class="hx"><h2 style="font-family:DM Sans,sans-serif;font-weight:800;color:var(--gold-deep)">Skill Changes — before → after</h2>'
    +'<p>Every skill Rune Zero rebalanced, grouped by class. <b style="color:var(--rare)">Usability</b> bars shrink — cast / cooldown / SP eased so a skill becomes spammable &amp; affordable. <b style="color:var(--warn)">Damage</b> bars grow — per-level ratio buffed so it hits hard enough to main on. Hatched = old, solid = new.</p></div>'
    +`<div class="statline"><div class="statbox"><b>${BALANCE.length}</b><small>Skills</small></div><div class="statbox"><b>${usab}</b><small>Usability</small></div><div class="statbox"><b>${dmg}</b><small>Damage</small></div></div></div>`;
  let lastTier=-1;
  keys.forEach(k=>{
    const arr=groups[k], ord=+k.split('|')[0], cls=k.split('|')[1];
    if(ord!==lastTier){ lastTier=ord; h+=`<div class="tierhead"><span class="tn">${tierName[ord]}</span><span class="tl"></span></div>`; }
    h+=`<div class="clscard"><div class="ch">${clsIcon(cls)}<span class="cn">${be(cls)}</span><span class="cc">${arr.length} skill${arr.length!==1?'s':''}</span></div>`;
    arr.forEach(s=>{
      h+=`<div class="skrow"><span class="sn">${be(s.skill)}</span> <span class="sa">${be(s.aegis)}</span>`;
      if(s.damage) h+=' <span class="tag dmg">dmg</span>';
      if(s.usability&&s.usability.length) h+=' <span class="tag use">usability</span>';
      if(s.build) h+=`<div class="sb">${be(s.build)}</div>`;
      h+='<div class="cmp">';
      (s.usability||[]).forEach(u=>h+=usChip(u));
      if(s.damage) h+=dmgChip(s.damage);
      h+='</div></div>';
    });
    h+='</div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

function buildAmpPills(items){
  if(items.length===2){
    const [a,b]=items;
    if(a.amps.length && a.amps.length===b.amps.length && a.amps.every((x,i)=>x.name===b.amps[i].name))
      return a.amps.map((x,i)=>`<span class="amppill">${esc(x.name)} <b>+${x.pct}%</b> / <b>+${b.amps[i].pct}%</b></span>`).join('');
  }
  return items.map(it=>it.amps.map(a=>`<span class="amppill">${esc(a.name)} <b>+${a.pct}%</b></span>`).join('')).join('');
}
function buildEstLines(items){
  const lines=[];
  for(const it of items) for(const a of (it.amps||[])){
    if(a.kind!=='skill') continue;
    lines.push(`<div class="dmgestline">${esc(it.name)}${it.slotted?' [1]':''} — ${esc(a.name)}: <span class="dmgest-calc" data-pct="${a.pct}">${estLine(a.pct)}</span></div>`);
  }
  return lines.join('');
}
function buildCard(f){
  const itemLine=f.items.map(it=>`<a onclick="location.hash='item/${it.id}'">${esc(it.name)}${it.slots?` [${it.slots}]`:''}</a>`).join(' / ');
  const est=buildEstLines(f.items);
  return `<div class="buildcard"><div class="bt"><span class="btn">${esc(f.fantasy)}</span></div>`
    +`<div class="bitems">${itemLine}</div>`
    +`<div>${buildAmpPills(f.items)}</div>`
    +(est?`<div class="dmgest-mini">${est}</div>`:'')
    +`</div>`;
}
function comboCard(c){
  const withnames=c.members.map(m=>`<a onclick="location.hash='item/${m.id}'">${esc(m.name)}</a>`).join(' + ');

  const est=c.amps.filter(a=>a.kind==='skill').map(a=>`<div class="dmgestline">${esc(a.name)}: <span class="dmgest-calc" data-pct="${a.pct}">${estLine(a.pct)}</span></div>`).join('');

}

    <p style="margin-bottom:12px">Steady, build-shaping power you earn by playing — farm it, craft it, engrave it. Runes give <b>secondary combat stats</b> (ATK, MATK, Crit, Crit Damage, after-cast delay, cast time) - <b>linear, build-specific power</b>, not raw stat inflation. Gated behind farming + crafting + a zeny sink; never sold for cash.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px">
      <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px">
        <div style="font-family:'DM Sans',sans-serif;font-weight:800;color:var(--gold-deep);font-size:14px;margin-bottom:4px">1. Farm crystals</div>
        <p style="font-size:12.5px;margin:0">Break <b>Crystal nodes</b> in the dungeons - <b>Mana Crystal</b> (mid) and <b>Prismatic Crystal</b> (deep) - for <b>Crystal Shards</b> and the rare <b>Radiant Crystal</b>. Immobile, 0 EXP.</p></div>
      <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px">
        <div style="font-family:'DM Sans',sans-serif;font-weight:800;color:var(--gold-deep);font-size:14px;margin-bottom:4px">2. Cut a rune</div>
        <p style="font-size:12.5px;margin:0"><b>Rune Artisan</b> (Prontera): shards + zeny for a <b style="color:#13a99a">Normal rune</b>; or shards + <b>Radiant Crystals</b> + zeny for a <b style="color:#b27c1b">Greater rune</b> (stronger).</p></div>
      <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px">
        <div style="font-family:'DM Sans',sans-serif;font-weight:800;color:var(--gold-deep);font-size:14px;margin-bottom:4px">3. Engrave it</div>
        <p style="font-size:12.5px;margin:0"><b>Rune Engraver</b>: fuse a rune into a <b>free option slot</b> of equipped gear. Up to <b>3 runes/item</b>, ~70% success (a failed rune shatters, gear safe). A <b>Radiant Crystal</b> = guaranteed.</p></div>
    </div>
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-family:'DM Mono'">The six runes (Normal / Greater)</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px 16px">
      ${runeRow('Might','+8 / +12 ATK',0)}${runeRow('Sorcery','+8 / +12 MATK',1)}${runeRow('Precision','+2 / +3 Crit',2)}${runeRow('Ferocity','+4 / +6% Crit Dmg',3)}${runeRow('Alacrity','-2 / -3% After-cast',4)}${runeRow('Focus','-2 / -3% Cast',5)}
    </div></div>`;
  const profBox=(ic,nm,node,where,mats,craft,col)=>`<div style="background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px">
      <div style="font-family:'DM Sans',sans-serif;font-weight:800;color:${col};font-size:14px;margin-bottom:4px">${ic} ${nm}</div>
      <p style="font-size:12.5px;margin:0 0 6px"><b>Gather:</b> break <b>${node}</b> in ${where}. Yields ${mats}.</p>
      <p style="font-size:12.5px;margin:0;color:var(--muted)"><b style="color:var(--ink)">Craft (level-gated):</b> ${craft}</p></div>`;
  const profPage=`<div class="card" style="grid-column:1/-1"><h4><span class="si">⛏️</span>Professions — gather, level up, craft</h4>
    <p style="margin-bottom:12px">Three gathering trades that level <b>1 → 100</b> per character. <b>Break gathering nodes</b> for materials + profession XP + a level-scaled bonus yield — then spend that level: the <b>Profession Master</b> (Prontera) unlocks <b>crafting recipes</b> as each trade grows. Mats also feed refining, forging &amp; alchemy. Open it all with <code>@prof</code> (includes an in-game guide). <b>Master a trade (Lv 100)</b> for a <b>wearable title</b> + a permanent stat in the <b>Hall of Titles</b>; master all three for <span class="rwd" style="display:inline-block">Grandmaster Artisan</span>.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
      ${profBox('⛏️','Mining','Ore Veins','mines &amp; caves (Mjolnir, Einbroch, Payon, Ant Hell)','Iron Ore, Coal, Steel, rare Oridecon/Elunium','smelt ores — Iron → Steel → Elunium / Oridecon','#b27c1b')}
      ${profBox('🌿','Herbalism','Herb Clusters','fields (Prontera, Geffen, Payon, Morocc)','Yellow/Green/White/Blue/Red Herbs','brew potions — Red / Yellow / White / Blue (great with @autopot)','#1f9d57')}
      ${profBox('🎣','Fishing','Fishing Spots','ports &amp; beaches (Izlude, Alberta, Comodo)','Sharp Scale, Gill, Fish, Tendon','cook stat foods — +3 / +5 STR/AGI/VIT buff dishes','#2f7fd6')}
    </div></div>`;
  const oghPhase=(n,title,body,col)=>`<div style="background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px">
      <div style="font-family:'DM Sans',sans-serif;font-weight:800;color:${col};font-size:14px;margin-bottom:4px">${n}. ${title}</div>
      <p style="font-size:12.5px;margin:0">${body}</p></div>`;
  const oghPage=`<div class="card" style="grid-column:1/-1"><h4><span class="si">👑</span>Old Glast Heim — Amdarais, the flagship boss</h4>
    <p style="margin-bottom:12px">Old Glast Heim's undead lord, and the server's premier <b>mechanics-gated</b> fight — Amdarais changes what you have to <i>do</i>, not just how big his health bar is. Fight through two waves of guardians, then face the lord himself in the haunted cathedral. Enter via the <b>Ghost of the Sovereign</b> at Eden HQ (Base Level 99+) on Normal, Hard, or Nightmare — harder tiers never cost an extra entry or touch drop rates. In a hurry? <b>Fast Mode</b> skips both guardian waves and drops you straight into the boss room, same reward either way.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px">
      ${oghPhase(1,'Reinforcements','At ≤75% HP, two adds spawn. Leave them alive and Amdarais <b>heals</b> a slice of max HP every tick — clear them fast or lose the DPS race.','#e0655a')}
      ${oghPhase(2,'Enrage','At ≤40% HP he enrages (+ATK) and starts channeling ground-targeted attacks at a random party member\'s tile — the cast circle is your dodge window; standing still is what kills you.','#c9853a')}
      ${oghPhase(3,'Enrage timer','Run past the Challenge-Tier time limit (10/8/6 min Normal/Hard/Nightmare) and he gets meaner again — a DPS and coordination check, not just a bigger health bar.','#b07ad6')}
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin:0">Every clear pays Valor Coin, Hunter Coin and MVP Points, scaled up by Challenge Tier — plus a shot at the grail-tier <b>Amdarais Card</b>: +15% damage on every class and +15% MATK, at the cost of 666 HP every 4 seconds while worn. Hard and Nightmare clears earn their own titles.</p></div>`;

  const ferlockPage=`<div class="card" style="grid-column:1/-1"><h4><span class="si">🐉</span>Ferlock Ship — Captain Ferlock, the 2nd flagship boss</h4>
    <p style="margin-bottom:12px">A second mechanics-gated flagship: Captain Ferlock, a colossal MVP Dragon who commands his own airship. Every trick Amdarais pulls, Ferlock answers with fire — a hair easier than Old Glast Heim, but a serious fight in its own right. Enter via the <b>Sky Warden</b> at Eden HQ (Base Level 99+), with the same Normal/Hard/Nightmare tiers and Fast Mode as Old Glast Heim.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px">
      ${oghPhase(1,'Reinforcements','At ≤75% HP, two Sky Sentinels spawn. Leave them alive and Ferlock <b>heals</b> a slice of max HP every tick.','#4f8fe0')}
      ${oghPhase(2,'Airborne fury','At ≤40% HP he takes to the air (+ATK) and starts breathing fire at your feet — the cast bar is your dodge window; standing still is what kills you.','#e0655a')}
      ${oghPhase(3,'Enrage timer','Run past the Challenge-Tier time limit and the ship groans under his fury — a DPS and coordination check.','#c9853a')}
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin:0">Defeat Ferlock for a full reward set — <b>Felrock's Armor, Cloak, Boots, and Hat</b> — plus the grail-tier <b>Felock Card</b>: a universal +30 ATK, +30 MATK, and +15% damage against Dragons, useful on any class. Hard and Nightmare clears earn their own titles.</p></div>`;

  const ghostPalacePage=`<div class="card" style="grid-column:1/-1"><h4><span class="si">⚔️</span>Ghost Palace — the weapon-farm dungeon</h4>
    <p style="margin-bottom:12px">The server's great weapon-farm dungeon — clear it for <b>Gray Shard</b>, the currency behind the widest best-in-slot weapon line on the server. Fight two waves of Torturous Redeemers, then bring down the <b>Reliquary Warden</b> itself for a guaranteed lump sum of shards. Enter via the <b>Palace Keeper</b> at Eden HQ (Base Level 99+, 1 free entry/day, VIP +1), then spend your haul with the <b>Dimension Traveler</b> next door — no clear needed just to browse and buy.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
      <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px">
        <div style="font-family:'DM Sans',sans-serif;font-weight:800;color:var(--gold-deep);font-size:14px;margin-bottom:4px">🗡️ Thanos weapons — 200 shards</div>
        <p style="font-size:12.5px;margin:0">One weapon per subtype — <b>14 types</b>, from sword to whip — so every class has a genuine best-in-slot pick. Each brings solid flat ATK/MATK and built-in lifesteal, balanced by a steep drawback: 100 HP lost every 10 seconds while equipped.</p></div>
      <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px">
        <div style="font-family:'DM Sans',sans-serif;font-weight:800;color:var(--gold-deep);font-size:14px;margin-bottom:4px">🛡️ Gray armor set — 100 shards</div>
        <p style="font-size:12.5px;margin:0">Shield, body, garment, shoes, headgear — a full 5-piece refine-scaling set (Holy resist that grows with refine), open to every class.</p></div>
      <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px">
        <div style="font-family:'DM Sans',sans-serif;font-weight:800;color:var(--gold-deep);font-size:14px;margin-bottom:4px">🃏 Knight Sakray Card — 10,000 shards</div>
        <p style="font-size:12.5px;margin:0">The special-tab grail: +20 ATK and +30% damage to Demon &amp; Undead. A true long-term chase at 10,000 shards — not a quick pickup.</p></div>
    </div></div>`;

  const acc=(icon,title,count,body,openByDefault)=>`<details class="acc"${openByDefault?' open':''}><summary><span class="accicon">${icon}</span>${title}<span class="acccount">${count} systems</span><span class="accarrow">▸</span></summary><div class="accbody"><div class="syscards">${body}</div></div></details>`;

  const groupGear = [
    card('🏆','Hunting Log — permanent milestones','Kill marquee monsters or clear whole dungeons for a <b>permanent stat</b> + a <b>wearable title</b>, tracked live in your Quest Window. MVP milestones are the ultimate grind. See the <b>Hunting Log</b> tab.','g'),
    card('🎲','Random Options on every drop','Dropped weapons, armor, garments, shoes, accessories and headgear roll <b>random options</b> by slot — straight from RO Zero. A second floor beam shows the <b>option count</b>: more options = rarer roll. Weapon %-damage rolls are 5–20%.'),
    card('🔨','Refinement — never breaks','Enriched ore refines safely +1→+7; HD ore pushes +8→+10 and only <b>downgrades</b> on fail. Ores are crafted from bulk ore + Valor Coin. Card removal is 100% safe.'),
    card('🪙','Valor &amp; Hunter Coins','Nearly everything here — refines, forges, instance entries — runs on coins you earn by playing. Valor Coin drops from almost every monster (the universal crafting/economy currency); Hunter Coin comes only from Hunter\'s Guild contracts. Both are play-only.'),
    card('🎯','Monster Hunter (bounties)','Your personal most-wanted board — rack up kills on a marked target and claim a signature weapon (Lord Knight\'s Warbreaker, Falcon\'s Wing, Vulcan\'s Fanfare) you can\'t get anywhere else.'),
    card('🌱','Memorial growing gear &amp; instances','Gear that levels up with you — craft it once and it keeps getting stronger as you refine it and finish its instances. A 5-piece <b>Memorial set</b> with refine-gated bonuses (+3/+6/+9), a non-destructive option enchanter, and a scaling set bonus. Materials drop from level-gated <b>Memorial instances</b> (Orc\'s Memory, Nidhoggur\'s Nest) in Normal/Hard.'),
    card('🏛️','Services Hub (Eden HQ)','The Eden Group HQ doubles as the all-in-one hub: register for the Eden badge, take bounty missions, and find every service — forge, refine, enchant, instances, Monster Hunter, stylist, storage — in one map. <code>@go eden</code> warps there.'),
    card('⚒️','Forge — risk &amp; reward','Forge any weapon with <b>5 random properties</b> and a chosen <b>element</b> baked in. ~70% success; failure consumes the materials. Costs mostly ore and only a little coin.'),
    card('🗡️','Eden weapons','A per-class weapon line bought with the <b>Eden badge</b>: each arrives already enhanced (5 options on purchase), grows as you refine it (+3/+6/+9), and you can re-roll its options until they fit your build. Yours alone — account-bound.'),
  ].join('');

  const groupEconomy = [
    card('📈','Fixed 5× / 5× / 3× rates','Every character earns the same rates — 5× base &amp; job EXP, 3× common/heal/use/equip/MVP-exclusive drops. Cards stay a hard 1× no matter what — see the <b>Rates</b> tab for the full breakdown.'),
    card('📅','Daily &amp; weekly loops','<b>Daily Tasks</b>: 3 rotating jobs reset at server midnight, with an escalating <b>login streak</b> day-7 jackpot. <b>Weekly Hunt</b>: a rotating featured MVP with a cross-player leaderboard and tiered rewards. Always something worth logging in for.'),
    card('🛍️','Cash shop — cosmetics + pay-to-fast','The <b>Rune Zero Boutique</b> is a native Cash Shop window selling <b>weekly-rotating cosmetic sets</b> (zero stats), staples, the Starter Pack, and the Premium Pass. The <b>Boutique Concierge</b> next door handles dye/name-color coupons and pay-to-fast bundles (EXP/common-drop boosts, convenience) payable in Cash Points <i>or</i> play-earned coins. <b>No power, no cards, no card/drop-on-card boosts ever sold</b>.'),
    card('🎰','Fortune Vault — zeny-sink gacha','A pure zeny sink in Prontera: <b>25,000z</b> for one pull or <b>250,000z</b> for ten. Prizes run from a guaranteed consolation Old Blue Box up to a <b>0.1% RARE costume</b> (server-wide announce) with common costumes, refine packs and booster bundles in between — no cards, no MVP loot, ever. A hidden pity counter guarantees a common costume by your 100th pull without landing one.'),
    card('🚪','Warp &amp; repair fees','Every warp works for everyone; non-VIP pays a small zeny toll — 500z for towns, 1,000z for fields/dungeons, 300z to re-warp to your last spot — and the Repair Smith charges 5,000z to fix broken gear. An active VIP sub waives every fee. See the <b>Rates</b> tab for the full VIP comparison.'),
  ].join('');

  const groupEvents = [
    card('👑','Champion / Lucky / Frenzy monsters','Any normal kill can spawn a roaming <b>special</b> of that monster, aura-lit with a map announce.<br><b>Champion</b> — a mini-boss at ~3× strength with minions and a guaranteed top-roll drop; 15% of the time it brings 2–3 "Guard" adds, and clearing the whole pack pays roughly <b>+40%</b>.<br><b>Frenzy</b> — a fast brawler that bursts EXP when it drops.<br><b>Lucky</b> — a rare loot piñata worth about 100 normal kills.<br>Each rolls <b>1–3 affixes</b> (Sturdy, Vigorous, Swift, Deadly, Resilient, Evasive) stacked onto its name — <i>“Swift Deadly Champion Poring”</i> — for a small Valor + EXP bonus. Base odds about 1.5%.'),
    card('🐾','Adventurer Allies — bond &amp; revive','Your recruited ally companions carry a permanent per-class <b>Bond level</b> (1–10, earned from kills while that ally fights beside you) that boosts its buff tiers, with flavour titles at Bond 4/7/10 (Loyal / Devoted / Sworn). Town Healers heal you for free; for Blessing and Increase AGI, summon an Ally — buffs are their job. If an ally dies, a 5-minute window lets you re-summon it at half the usual fee.'),
    card('🏁','MVP Arena speedrun boards','Every Challenge Tier (Normal / Hard / Nightmare) keeps an all-time top-5 leaderboard of fastest clears — check it from the <code>@mvprank</code> command\'s Speedrun Leaderboard page. Only a genuine personal best earns a shot at the board.'),
    card('🎣','Fishing streaks &amp; Golden Fish','Landing 5 catches in a row (broken by changing maps or idling 2 minutes) grants a bonus yield roll, and every catch has a shot at a rare <b>Golden Fish</b> — 2% normally, 4% on a streak of 10+. Turn in 5 Golden Fish at the Profession Master for Valor Coins and bonus Fishing XP.'),
    card('🎉','Server events','<b>Find the Mushroom</b>, <b>Speed Quiz</b> (trivia — first to reach the Quizmaster with the right answer wins the pot), and <b>Fever Field</b> (a hot-zone map goes live for 25 minutes with a guaranteed +3 bonus Valor Coin per kill) rotate every 2 hours off the Event Herald, plus a classic <b>Disguise</b> event that periodically hides a random monster in a familiar mob\'s skin for whoever spots it first.'),
  ].join('');

  $('#systems').innerHTML=`<h2>Rune Zero — Features</h2>
  <p style="color:var(--muted);margin-bottom:18px">Every custom system running on the live server. Looking for rates or numbers? See the <a onclick="setView('rates');location.hash='rates'">Rates</a> tab. Looking for item/skill rebalances? See <a onclick="setView('customizations');location.hash='customizations'">Customizations</a>.</p>
  <div class="sectionhead"><span class="sn">Core systems</span><span class="sl"></span></div>
  <div class="syscards">
  ${oghPage}
  ${ferlockPage}
  ${ghostPalacePage}
  ${beamLeg}
  ${gemPage}
  ${profPage}
  </div>
  ${acc('🎒','Gear, Loot &amp; Progression',9,groupGear,true)}
  ${acc('💰','Daily Life &amp; Economy',5,groupEconomy)}
  ${acc('🌍','World Events &amp; Threats',5,groupEvents)}`;
}
