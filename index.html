function renderRates(){
  const el=$('#rates'); if(!el) return;
  const cell=(label,val,note,guard)=>`<div class="ratecell${guard?' guard':''}"><div class="rl">${esc(label)}</div><div class="rv">${esc(val)}</div>${note?`<div class="rn">${note}</div>`:''}${guard?'<span class="rg">GUARDRAIL</span>':''}</div>`;
  const head=(n)=>`<div class="sectionhead"><span class="sn">${n}</span><span class="sl"></span></div>`;
  let h=`<div class="homewrap">
    <div class="hero homehero"><div class="kicker">AT A GLANCE · LIVE CONFIG</div><h1 style="font-size:30px">Rates &amp; Fair Play</h1>
      <p>Every number below is exactly what the live server runs — no marketing spin. <b>5/5/3, forever</b> — no rate events, no VIP multipliers, no card-rate inflation. Pay-to-fast, never pay-to-win: convenience and speed are for sale; the rare-power chase — cards — never is.</p></div>

    ${head('Experience')}
    <div class="ratesgrid">
      ${cell('Base EXP','5×','vs. official 1×')}
      ${cell('Job EXP','5×','vs. official 1×')}
      ${cell('MVP EXP','5×','same fixed rate')}
      ${cell('Quest EXP','1×','modern quest rewards are already large')}
    </div>

    ${head('Drop rates')}
    <div class="sectionsub">Common materials, equipment, and even MVP-exclusive loot all run at the same fixed 3× — cards are the one rate that never moves.</div>
    <div class="ratesgrid">
      ${cell('Common drops','3×','junk, materials, consumables')}
      ${cell('Heal / Use items','3×','potions &amp; consumables')}
      ${cell('Equipment drops','3×','weapons &amp; armor')}
      ${cell('MVP-exclusive loot','3×','trophy pieces, MVP-only gear')}
      ${cell('Card drops','1×','never boosted, ever',true)}
      ${cell('Treasure boxes','1×','economy/WoE-linked')}
      ${cell('Scripted bonus drops','1×','e.g. Monster Hunter rewards')}
    </div>

    ${head('Death &amp; party')}
    <div class="ratesgrid">
      ${cell('Death penalty','3%','of current level EXP · VIP pays 0%')}
      ${cell('Party share range','15 levels','+40% EXP per extra even-share member')}
      ${cell('Multi-level from one kill','Off','one level at a time, official-style')}
    </div>

    ${head('Combat &amp; economy')}
    <div class="ratesgrid">
      ${cell('Max ASPD','190','classic pre-renewal ceiling')}
      ${cell('NPC sell prices','50%','of stock value — Overcharge still stacks on top')}
      ${cell('Sit HP/SP regen','+3%/sec','of max HP &amp; SP, any class, while sitting')}
      ${cell('Warp toll (town)','500z','waived for VIP')}
      ${cell('Warp toll (field/dungeon)','1,000z','waived for VIP')}
      ${cell('Re-warp (last spot)','300z','waived for VIP')}
      ${cell('Gear repair','5,000z','waived for VIP')}
    </div>

    ${head('VIP — pay-to-fast, not pay-to-win')}
    <div class="sectionsub">Everything VIP gives is speed or convenience. The hard exclusion list never moves.</div>
    <div class="vipgrid">
      <div class="vipcol yes"><h4>✓ What VIP gives</h4><ul>
        <li>+15% Base &amp; Job EXP</li>
        <li>0% death penalty (vs. 3% for everyone else)</li>
        <li>+300 storage slots</li>
        <li>Gemstone-free skill casting</li>
        <li>+10% <i>common-drop-only</i> bonus — cards &amp; MVP loot structurally excluded</li>
        <li>Waived warp &amp; repair tolls</li>
      </ul></div>
      <div class="vipcol no"><h4>✕ What VIP never gives</h4><ul>
        <li>Stat, ATK, or MATK power of any kind</li>
        <li>Card or MVP-loot drop-rate boosts</li>
        <li>Forge success-rate boosts</li>
        <li>Best-in-slot gear gated behind a paywall</li>
        <li>Easier or exclusive MVP access</li>
      </ul></div>
    </div>

    ${head('Free QoL, for everyone')}
    <div class="sectionsub">No VIP tier required — every player gets these from day one.</div>
    <div class="cmdgrid">
      ${['@go','@autoloot','@alootid','@autoloottype','@autotrade','@noks','@iteminfo','@mobinfo','@whodrops','@whereis','@storage','@time','@exp','@showexp','@showdelay','@refresh','@request'].map(c=>`<span class="cmdpill">${c}</span>`).join('')}
    </div>
    <p class="homefoot">Every value on this page reflects the live server configuration · built ${META.built||''}.</p>
  </div>`;
  el.innerHTML=h;
}

//  linking out to the Fun Builds / Skill Changes / Items tabs for full detail.

function renderCustomizations(){
  const el=$('#customizations'); if(!el) return;
  const stat=(n,l)=>`<div class="statbox"><b>${n}</b><small>${l}</small></div>`;
  const card=(ic,t,b,cls)=>`<div class="card${cls?' '+cls:''}"><h4><span class="si">${ic}</span>${t}</h4><p>${b}</p></div>`;
  const rule=(ic,t,b)=>`<div class="rulebox"><span class="ri">${ic}</span><div><b>${t}</b><p>${b}</p></div></div>`;
  let h=`<div class="homewrap">

    <div class="note">This is a multi-step item chain, not a single drop — follow it in order. Every NPC in this chain stands in the Eden HQ entrance hall, just north of where you arrive.</div>`;
  h+=instStep(1,'Farm the material','Kill <a onclick="location.hash=\'mob/2476\'">Amdarais</a> for a chance at <a onclick="location.hash=\'item/6607\'">Temporal Crystal</a> (~1.5% per kill) — the core material for every step below.');
  h+=instStep(2,'Buy the base boots',npcTag("Hugin's Butler")+' trades 1 Temporal Crystal for a plain <a onclick="location.hash=\'item/2499\'">Temporal Boots</a>.');
  h+=instStep(3,'Pick an element','Wear the base boots and bring 5 more Temporal Crystal back to Hugin&rsquo;s Butler to convert them into one of 6 stat-flavored variants (refine resets on conversion): '+bootLinks+'.');
  h+=instStep(4,'Enchant it (4 tiers)',npcTag("Hugin's Magician")+' enchants the unslotted boots (must be worn) with <a onclick="location.hash=\'item/6608\'">Coagulated Spell</a> — pick one of 6 effect families (Fighting Spirit, Archery, Spell, Vitality, Attack Speed, Lucky) and it grows through 4 escalating tiers (1 &rarr; 4 &rarr; 15 &rarr; 30 Coagulated Spell). This step never fails.');
  h+=instStep(5,'Optionally add a slot — real risk',npcTag("Hugin's Craftsman")+' can socket the boots for 5 more Temporal Crystal, but it is only a <span style="color:var(--bad);font-weight:700">50% success chance</span> — fail, and the boots (with everything enchanted onto them) are destroyed outright. Think carefully before rolling.');
  h+=instStep(6,'Further-enchant the slotted boots','Once slotted, '+npcTag('Dark magic master')+' continues the same 4-tier ladder using Coagulated Spell + <a onclick="location.hash=\'item/6755\'">Contaminated Magic</a> + 100,000 zeny per attempt. The first tier always succeeds, but every tier after that (including the final bonus-effect roll) is only a <span style="color:var(--bad);font-weight:700">70% success chance</span> — a failed attempt destroys the boots.');
  h+='</div>';
  h+=`<div class="sec"><h4>4th slot — the effect ladder (pick one family)</h4>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">Whichever family you pick at step 4 grows through all 4 tiers on the same boots — you can't mix families on one pair. Match the family to your build — Str boots pair naturally with Fighting Spirit, Dex with Archery, Int with Spell — but nothing stops you picking a different family if you'd rather chase a specific effect.</p>
    ${bootEnchantTable()}
  </div>`;
  h+=`<div class="sec"><h4>3rd slot — bonus-effect card (one random pick)</h4>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">Rolled once the 4th slot hits its final tier (costs more Coagulated Spell) — a single random pick from the 6 below, not a choice. Every one is an on-hit <b>proc</b>, not an always-on stat — it only fires (and only drains) while its short buff window is active. Read the drain and the unequip tax before deciding if the buff is worth chasing; they're costs, not fine print.</p>
    ${bootBonusTable()}
  </div>`;
  return h;
}
function sectionPortraitCollector(){

    <p style="font-size:13px">${npcTag('Portrait Collector')} stands in the Eden HQ entrance hall, just north of where you arrive — and trades a bulk pile of Old Glast Heim currency for one of two cards. Pay with <b>either</b> currency, not both.</p>

function instHero(inst){
  return `<div class="hero"><div class="hx"><h2>${inst.icon} ${esc(inst.name)}</h2><p>${esc(inst.tagline)}</p></div>
    <div class="statline">
      <div class="statbox"><b>${inst.bossLevel}</b><small>Boss Level</small></div>
      <div class="statbox"><b>${(inst.bossHp/1000000).toFixed(1)}M</b><small>Boss HP</small></div>
      <div class="statbox"><b>${esc(inst.freeEntries.split(' ')[0])}</b><small>Free entries/day</small></div>
    </div></div>`;
}
function sectionEnter(inst){
  const e=inst.entry;
  return `<div class="sec"><h4>How to enter</h4>
    <dl class="kv">
      ${row('Entry NPC', (e.sprite?npcAvatar(e.sprite):'')+esc(e.npc)+' — '+esc(e.npcLoc))}
      ${row('Instance map', esc(e.instMap))}
      ${row('Base Level required', e.baseLevel+'+')}
      ${row('Solo or party', esc(e.party))}
      ${row('Free entries', esc(inst.freeEntries))}
    </dl>
    <div class="note">Extra entries past the daily free one cost <b>${e.scrollCost} Summon Scroll</b>, OR <b>${e.valorCost} Valor Coin</b>, OR <b>${e.hunterCost} Hunter Coin</b> — a harder Challenge Tier never costs an extra entry. <b>Fast Mode</b> is also offered on entry: skip both trash waves and go straight to the boss, same reward either way, just less lead-up.</div>
  </div>`;
}
function tierTable(inst){
  let h='<table class="dense"><thead><tr><th>Tier</th><th>Boss HP</th><th>ATK</th><th>DEF/MDEF</th><th>Coin &amp; EXP</th><th>MVP Points</th></tr></thead><tbody>';
  inst.tiers.forEach(t=>{ h+=`<tr><td>${esc(t.name)}</td><td class="mono">${t.hp}</td><td class="mono">${t.atk}</td><td class="mono">${t.def}</td><td class="mono">${t.coinExp}</td><td class="mono">${t.points}</td></tr>`; });
  h+='</tbody></table>';
  return scrollT(h);
}
function dropTagLabel(rate){
  if(rate<=10) return 'boss-exclusive';
  if(rate<=100) return 'rare drop';
  if(rate<=1000) return 'uncommon drop';
  return 'common drop';
}
function instDropRow(d){
  const tag=d.tag||dropTagLabel(d.rate);
  const note=(d.note?d.note+' · ':'')+rateBar(d.rate);
  let h=rewardCard(d.id,note,tag);
  return h;
}
function instCard(inst){
  return `<button class="instcard" onclick="location.hash='instance/${inst.slug}'">
    <div class="ict">${inst.icon} ${esc(inst.name)}</div>
    <div class="ictag">${esc(inst.tagline)}</div>
    <div class="icstats"><span class="pill">Lv ${inst.bossLevel}</span><span class="pill">${inst.bossHp.toLocaleString()} HP</span><span class="pill">${esc(inst.freeEntries)}</span></div>
    <div class="icwhy"><b>Why farm this:</b> ${esc(inst.whyFarm)}</div>
  </button>`;
}
function renderInstances(){
  const el=$('#instances'); if(!el) return;
  el.innerHTML=`<div class="homewrap">
    <div class="hero homehero"><div class="kicker">ENDGAME · MECHANICS-GATED</div><h1 style="font-size:30px">Instances</h1>
      <p>Three level-99 flagship fights, each with real mechanics — add-phases, enrage, telegraphed attacks — instead of just a bigger health bar. Pick one for the full walkthrough: how to enter, every mechanic explained in plain language, and the complete reward list.</p></div>
    <div class="instgrid">${INSTANCES.map(instCard).join('')}</div>
    <p class="homefoot">Boss stats, drop rates and NPC costs pulled straight from the live instance scripts &amp; database · built ${META.built||''}.</p>
  </div>`;
}
function renderInstanceDetail(slug){
  const el=$('#instances'); if(!el) return;
  const inst=INSTANCES.find(i=>i.slug===slug);
  if(!inst){ el.innerHTML='<div class="homewrap"><p style="color:var(--muted)">Unknown instance. <a onclick="location.hash=\'instances\'">Back to Instances</a></p></div>'; return; }
  let h='<div class="homewrap">';
  h+=`<div style="margin-bottom:14px"><a onclick="location.hash='instances'">← Back to Instances</a></div>`;
  h+=instHero(inst);
  h+=sectionEnter(inst);
  h+=`<div class="sec"><h4>Challenge Tiers</h4>${tierTable(inst)}<div class="rate" style="margin-top:6px">Harder tiers scale the guaranteed reward layer — never drop rates, never the card. Same guardrail as every MVP fight on the server.</div></div>`;
  h+=`<div class="sec"><h4>The fight</h4><ol style="padding-left:20px;margin:8px 0">${inst.mechanics.map(m=>`<li style="margin:8px 0;font-size:13.5px">${m}</li>`).join('')}</ol></div>`;
  h+=`<div class="sec"><h4>What you take home</h4><p style="font-size:13px">${inst.rewardText}</p>`;
  if(inst.drops&&inst.drops.length){
    h+='<div style="margin-top:8px"><div style="font-family:\'DM Mono\';font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Full drop table</div>'+inst.drops.map(instDropRow).join('')+'</div>';
  }
  if(inst.mvpDrops&&inst.mvpDrops.length){
    h+='<div style="margin-top:10px"><div style="font-family:\'DM Mono\';font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">MVP-exclusive bonus roll</div>'+inst.mvpDrops.map(instDropRow).join('')+'</div>';
  }
  h+='</div>';
  if(inst.extraSection) h+=inst.extraSection();
  h+=`<p class="homefoot">Boss stats &amp; drop rates pulled straight from the live database · built ${META.built||''}.</p>`;
  h+='</div>';
  el.innerHTML=h;
}

const row=(k,v)=> v!=null&&v!==''?`<dt>${k}</dt><dd>${v}</dd>`:'';
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pct=r=>r>=100?(r/100).toFixed(r%100?2:0)+'%':(r/100).toFixed(2)+'%';
function debounce(f,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);};}
boot();
