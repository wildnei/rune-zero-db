<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7fbf4">
  <meta name="description" content="Discover RuneZero, a thoughtful low-rate Ragnarok Online adventure, and explore its complete player wiki.">
  <title>RuneZero — A classic adventure, thoughtfully reimagined</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="site-header" data-site-header>
    <a class="brand" href="#home" aria-label="RuneZero home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" focusable="false"><path d="M24 3 29 15 41 20 29 25 24 45 19 25 7 20 19 15Z"/><circle cx="24" cy="20" r="7"/></svg>
      </span>
      <span class="brand-name">Rune<span>Zero</span></span>
    </a>

    <div class="header-tools">
      <button class="search-button" type="button" data-search-button>
        <span aria-hidden="true">⌕</span><span>Search wiki</span><kbd>/</kbd>
      </button>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="mobile-nav" data-menu-button>
        <span class="sr-only">Open navigation</span>
        <span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <aside class="site-sidebar" aria-label="Wiki navigation">
    <nav aria-label="Primary" data-primary-nav></nav>
  </aside>

  <div class="mobile-drawer" id="mobile-nav" hidden data-mobile-drawer>
    <div class="mobile-drawer-head">
      <span class="brand-name">Rune<span>Zero</span></span>
      <button class="icon-button" type="button" data-drawer-close><span class="sr-only">Close navigation</span>×</button>
    </div>
    <nav aria-label="Mobile" data-mobile-nav></nav>
  </div>
  <div class="drawer-backdrop" hidden data-drawer-backdrop></div>

  <main id="app" tabindex="-1"></main>
  <div class="site-status" role="status" aria-live="polite" data-site-status>Loading RuneZero…</div>

  <script type="module" src="js/app.mjs"></script>
</body>
</html>
